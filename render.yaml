# Render 一键部署配置（视频相册）
services:
  - type: web
    name: video-album
    runtime: node
    region: oregon
    rootDir: .
    buildCommand: "true"
    startCommand: "node server.js"
    healthCheckPath: "/api/health"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: "/var/data/video-album"
    disks:
      - name: video-album-data
        mountPath: "/var/data/video-album"
        sizeGB: 1
